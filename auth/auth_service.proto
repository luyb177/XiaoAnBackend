syntax = "proto3";
import "third_party/google/protobuf/any.proto";
package auth;
option go_package = "./auth/v1";

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// ======================
// ======= model ========
// ======================
// ---------------------------------------------------------------------------------------------------------------------

message User {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string avatar = 4;
  string phone = 5;
  string department = 6;

  string role = 7;           // superadmin / classadmin / student / staff
  uint64 class_id = 8;       // 所属班级 学生 ID
  int64 status = 9;         // 1 正常 2 禁用 3 删除
  string invite_code_used = 10;

  int64 created_at = 11;
  int64 updated_at = 12;
}

message InviteCode {
  string code = 1;
  uint64 creator_id = 2;
  string creator_name = 3;
  string department = 4;

  uint64 max_uses = 5;
  uint64 used_count = 6;
  string remark = 7;

  string target_role = 8;    // 邀请码的目标角色 classadmin / student / staff
  uint64 class_id = 9;       // student 用，注册自动加入班级 其中 0 表示没有班级

  int64 created_at = 10;
  int64 updated_at = 11;
  int64 expires_at = 12;
}

message Class {
  uint64 id = 1;                // 班级 ID
  string name = 2;              // 班级名称，如 "软件工程 2201 班"
  string department = 3;        // 所属部门 / 学院
  uint64 admin_id = 4;          // 班级管理员（班主任）
  string admin_name = 5;        // 管理员名称，冗余字段（方便查询）

  uint64 student_count = 6;     // 班级学生数量
  int64 status = 7;             // 状态：1 正常，2 禁用，3 已解散

  int64 created_at = 8;         // 创建时间
  int64 updated_at = 9;         // 更新时间
}

enum LoginType {
  UNKNOWN = 0;
  EMAIL_CODE = 1;
  PASSWORD = 2;
}

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// =================
// ==== Request ====
// =================
// ---------------------------------------------------------------------------------------------------------------------

message SendEmailRequest {
  string email = 1;
}

message ValidateEmailRequest {
  string email = 1;
  string code = 2;
}

message GenerateInviteCodeRequest {
  string department = 1;
  uint64 max_uses = 2;
  string remark = 3;
  int64 expires_at = 4;

  string target_role = 5; // 邀请码的目标角色
  uint64 class_id = 6;  // student用，注册时自动加入班级
}

message GetInviteCodeRequest {
  int64 page_size = 1;
  uint64 cursor = 2; // 上次查询的最后一个邀请码的 ID，第一次查询传 0
}

message ValidateInviteCodeRequest {
  string code = 1;
}

message LoginRequest {
  LoginType type = 1; // 1: email + email_code 2: email + password
  string email = 2;
  string password = 3;
  string email_code = 4;
}

message RegisterRequest {
  string email = 1;
  string email_code = 2;
  string password = 3;
  string invite_code_used = 4;
}

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// ==================
// ==== Response ====
// ==================
// ---------------------------------------------------------------------------------------------------------------------

message GenerateInviteCodeResponse {
  InviteCode code = 1;
}

message GetInviteCodeResponse {
  repeated InviteCode codes = 1;
  bool has_more = 2;
  uint64 next_cursor = 3;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message RegisterResponse {
  User user = 1;
}


message Response {
  int64 code = 1;
  string message = 2;
  google.protobuf.Any data = 3;
}

service AuthService {
  // 邮箱验证码
  rpc SendEmailCode(SendEmailRequest) returns (Response);

  // 邀请码
  rpc GenerateInviteCode(GenerateInviteCodeRequest) returns (Response);
  rpc GetInviteCode(GetInviteCodeRequest) returns (Response);

  // 注册登录
  rpc Register(RegisterRequest) returns (Response);
  rpc Login(LoginRequest) returns (Response);
}
