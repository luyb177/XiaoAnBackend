syntax = "proto3";
import "third_party/google/protobuf/any.proto";
package auth;
option go_package = "./auth/v1";

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// ======================
// ======= model ========
// ======================
// ---------------------------------------------------------------------------------------------------------------------

message User {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string avatar = 4;
  string phone = 5;
  string department = 6;

  string role = 7;           // superadmin / classadmin / student / staff
  uint64 class_id = 8;       // 所属班级 学生 ID
  int64 status = 9;         // 1 正常 2 禁用 3 删除
  string invite_code_used = 10;

  int64 created_at = 11;
  int64 updated_at = 12;
}

message UserInfo {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string avatar = 4;
  string phone = 5;
  string department = 6;

  string role = 7;           // superadmin / classadmin / student / staff
  uint64 class_id = 8;       // 所属班级 学生 ID
  int64 status = 9;         // 1 正常 2 禁用 3 删除

  int64 created_at = 10;
  int64 updated_at = 11;
}


message InviteCode {
  string code = 1;
  uint64 creator_id = 2;
  string department = 3;

  uint64 max_uses = 4;
  uint64 used_count = 5;
  string remark = 6;

  string target_role = 7;    // 邀请码的目标角色 classadmin / student / staff
  uint64 class_id = 8;       // student 用，注册自动加入班级 其中 0 表示没有班级

  int64 created_at = 9;
  int64 updated_at = 10;
  int64 expires_at = 11;
}

message Class {
  uint64 id = 1;                // 班级 ID
  string name = 2;              // 班级名称，如 "软件工程 2201 班"
  uint64 admin_id = 3;          // 班级管理员（班主任）

  uint64 student_count = 4;     // 班级学生数量
  int64 status = 5;             // 状态：1 正常，2 禁用，3 已解散

  int64 created_at = 6;         // 创建时间
  int64 updated_at = 7;         // 更新时间
}

enum LoginType {
  UNKNOWN = 0;
  EMAIL_CODE = 1;
  PASSWORD = 2;
}

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// =================
// ==== Request ====
// =================
// ---------------------------------------------------------------------------------------------------------------------

message SendEmailRequest {
  string email = 1;
}

message ValidateEmailRequest {
  string email = 1;
  string code = 2;
}

message GenerateInviteCodeRequest {
  string department = 1;
  uint64 max_uses = 2;
  string remark = 3;
  int64 expires_at = 4;

  string target_role = 5; // 邀请码的目标角色
  uint64 class_id = 6;  // student用，注册时自动加入班级
}

message GetInviteCodeRequest {
  int64 page_size = 1;
  uint64 cursor = 2; // 上次查询的最后一个邀请码的 ID，第一次查询传 0
}

message LoginRequest {
  LoginType type = 1; // 1: email + email_code 2: email + password
  string email = 2;
  string password = 3;
  string email_code = 4;
}

message RegisterRequest {
  string email = 1;
  string email_code = 2;
  string password = 3;
  string invite_code_used = 4;
}

message ModifyUserBaseInfoRequest {
  string name = 1;
  string avatar = 2;
  string phone = 3;

  uint64 user_id = 4;  // 要修改的用户 ID，管理员可修改其他用户信息，普通用户只能修改自己的信息
}

message GetUserInfoRequest {
  uint64 user_id = 1;
}

message GenerateClassRequest {
  string name = 1;
}

// todo 定位
// ---------------------------------------------------------------------------------------------------------------------
// ==================
// ==== Response ====
// ==================
// ---------------------------------------------------------------------------------------------------------------------

message GenerateInviteCodeResponse {
  InviteCode code = 1;
}

message GetInviteCodeResponse {
  repeated InviteCode codes = 1;
  bool has_more = 2;
  uint64 next_cursor = 3;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message RegisterResponse {
  User user = 1;
}

message GetUserInfoResponse {
  UserInfo user = 1;
}

message Response {
  int64 code = 1;
  string message = 2;
  google.protobuf.Any data = 3;
}

// ---------------------------------------------------------------------------------------------------------------------
// ==================
// ===== Route ======
// ==================
// ---------------------------------------------------------------------------------------------------------------------


service AuthService {
  // SendEmailCode 发送邮箱验证码
  rpc SendEmailCode(SendEmailRequest) returns (Response);

  // GenerateInviteCode 生成邀请码
  rpc GenerateInviteCode(GenerateInviteCodeRequest) returns (Response);

  // GetInviteCode 获取邀请码列表
  rpc GetInviteCode(GetInviteCodeRequest) returns (Response);

  // Register 注册
  rpc Register(RegisterRequest) returns (Response);

  // Login 登录
  rpc Login(LoginRequest) returns (Response);

  // ModifyUserBaseInfo 修改用户基本信息
  rpc ModifyUserBaseInfo(ModifyUserBaseInfoRequest) returns (Response);

  // GetUserInfo 获取用户信息
  rpc GetUserInfo(GetUserInfoRequest) returns (Response);

  // GenerateClass 生成班级
  rpc GenerateClass(GenerateClassRequest) returns (Response);
}
